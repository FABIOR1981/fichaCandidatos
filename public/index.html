<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de candidatos</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="vendor/mammoth.browser.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="barra-superior">
      <div class="marca">
        <span class="marca-icono" aria-hidden="true">◎</span>
        <div>
          <h1>Agenda de candidatos</h1>
          <p id="resumen" class="resumen-agenda"></p>
        </div>
      </div>
      <div class="herramientas">
        <label class="buscador">
          <span class="visualmente-oculto">Buscar</span>
          <input type="search" id="buscar" placeholder="Buscar por nombre, teléfono, email o localidad">
        </label>
        <label class="boton secundario" for="entrada-archivos">Subir CVs</label>
        <input type="file" id="entrada-archivos" accept=".pdf,.docx" multiple hidden>
        <button type="button" id="btn-nuevo" class="boton primario">Nuevo contacto</button>
      </div>
    </header>

    <main class="contenido">
      <div class="tabla-marco" id="tabla-marco">
        <table>
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Teléfono</th>
              <th scope="col" class="oculto-movil">Email</th>
              <th scope="col">Departamento</th>
              <th scope="col">Localidad</th>
              <th scope="col" class="columna-alertas">Alertas</th>
            </tr>
          </thead>
          <tbody id="tabla-contactos"></tbody>
        </table>

        <div id="vacio" class="estado-vacio" hidden>
          <p id="vacio-texto"></p>
          <div class="estado-vacio-acciones">
            <label class="boton secundario" for="entrada-archivos">Subir CVs</label>
            <button type="button" id="btn-nuevo-vacio" class="boton primario">Nuevo contacto</button>
          </div>
        </div>
      </div>
    </main>

    <aside id="panel-carga" class="panel-carga" hidden aria-live="polite">
      <header class="panel-cabecera">
        <strong>Carga de CVs</strong>
        <button type="button" id="cerrar-carga" class="boton-icono" aria-label="Cerrar">×</button>
      </header>
      <ul id="progreso" class="progreso"></ul>
    </aside>

    <aside id="detalle" class="drawer" hidden aria-label="Detalle del contacto"></aside>

    <dialog id="dialogo-form" class="dialogo">
      <form id="form-contacto" novalidate>
        <header class="dialogo-cabecera">
          <h2 id="titulo-form">Nuevo contacto</h2>
          <button type="button" id="cerrar-form" class="boton-icono" aria-label="Cerrar">×</button>
        </header>

        <div class="campos">
          <label class="ancho">Nombre completo *
            <input name="nombre" required autocomplete="off">
          </label>
          <label>Teléfono
            <input name="telefono" placeholder="099 123 456" inputmode="tel">
          </label>
          <label>Email
            <input name="email" type="email" autocomplete="off">
          </label>
          <label>Departamento
            <select name="departamento"><option value="">—</option></select>
          </label>
          <label>Localidad
            <select name="localidad"><option value="">—</option></select>
            <input name="localidad_otra" placeholder="Escribí la localidad" hidden>
          </label>
        </div>

        <p id="error-form" class="error" hidden></p>

        <footer class="dialogo-pie">
          <button type="button" id="cancelar-form" class="boton secundario">Cancelar</button>
          <button type="submit" class="boton primario">Guardar</button>
        </footer>
      </form>
    </dialog>

    <div id="zona-soltar" class="zona-soltar" hidden>
      <div>Soltá los CVs para cargarlos</div>
    </div>

    <footer class="pie">
      Datos personales de candidatos que los entregaron voluntariamente. Uso exclusivo para selección.
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
