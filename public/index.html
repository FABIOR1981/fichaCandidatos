<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de candidatos</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="vendor/mammoth.browser.min.js"></script>
</head>
<body>
  <header>
    <h1>Agenda de candidatos <span class="etiqueta">prueba</span></h1>
    <button type="button" id="btn-nueva" class="primario">+ Nuevo contacto</button>
  </header>

  <main>
    <section class="carga">
      <label class="zona-carga" id="zona-carga">
        <input type="file" id="entrada-archivos" accept=".pdf,.docx" multiple hidden>
        <strong>Subí uno o varios CVs en PDF o Word</strong>
        <span>Arrastralos acá o hacé clic para elegirlos</span>
      </label>
      <ul id="progreso" class="progreso"></ul>
    </section>

    <section>
      <div class="barra">
        <input type="search" id="buscar" placeholder="Buscar por nombre, teléfono, email, localidad…">
        <span id="contador" class="contador"></span>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th>Departamento</th>
              <th>Localidad</th>
              <th>Alertas</th>
            </tr>
          </thead>
          <tbody id="tabla-fichas"></tbody>
        </table>
        <p id="vacio" class="vacio" hidden>Todavía no hay contactos. Subí un CV o creá uno nuevo.</p>
      </div>
    </section>

    <section id="detalle" class="detalle" hidden></section>

    <section id="formulario" class="formulario" hidden>
      <div class="cabecera-detalle">
        <h2 id="titulo-formulario">Nuevo contacto</h2>
        <button type="button" id="btn-cancelar-form">Cancelar</button>
      </div>
      <form id="form-ficha" novalidate>
        <div class="campos">
          <label>Nombre completo *<input name="nombre" required></label>
          <label>Teléfono<input name="telefono" placeholder="099 123 456"></label>
          <label>Email<input name="email" type="email"></label>
          <label>Departamento<input name="departamento"></label>
          <label>Localidad<input name="localidad"></label>
        </div>
        <p id="error-form" class="error" hidden></p>
        <div class="acciones">
          <button type="submit" class="primario">Guardar</button>
          <button type="button" id="btn-cancelar-form-2">Cancelar</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    Datos personales de candidatos que los entregaron voluntariamente. Uso exclusivo para selección.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
